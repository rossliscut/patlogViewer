[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patlog-viewer"
version = "0.1.0"
description = "Fetch robot patlogs and show Mid-360 acceleration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "download-robot-logs @ git+https://github.com/rossliscut/download-robot-logs.git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patlog-viewer = "patlog_viewer.__main__:main"
patlog-viewer-mcp = "patlog_viewer.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patlog_viewer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
